name: Build & Release

# macOS DMG for v* tags (and optional manual runs). VirusTotal listens for this name.
#
# GitHub Actions billing (private repos / org limits): macOS minutes count as 10×.
# A full run here is often ~90–180 runner minutes → ~900–1800 billed minutes.
# Budget target for Clay: ~1 release build per month when quota is tight; use
# workflow_dispatch for extra runs. PR CI for macOS was removed to avoid surprise usage.
#
# Prefer local Mac builds (build/macos/, clay-appstore-local.sh) when Actions quota is low.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the DMG (adds 20+ minutes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG (arm64)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      OPT_PREFIX: /opt/homebrew
      CLAY_PREFIX: ${{ runner.temp }}/_install
      BUILD_DIR: ${{ runner.temp }}/build-arm64
      DIST_DIR: ${{ runner.temp }}/dist
    steps:
      - uses: actions/checkout@v7

      - name: Require Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Run scripts/push-apple-signing-to-github.sh"
            exit 1
          fi

      - name: Set up paths
        run: |
          {
            echo "PKG_CONFIG_PATH=$CLAY_PREFIX/lib/pkgconfig:$OPT_PREFIX/lib/pkgconfig:$OPT_PREFIX/share/pkgconfig:$OPT_PREFIX/opt/libarchive/lib/pkgconfig"
            echo "XDG_DATA_DIRS=$CLAY_PREFIX/share:$OPT_PREFIX/share"
            echo "GI_TYPELIB_PATH=$CLAY_PREFIX/lib/girepository-1.0:$OPT_PREFIX/lib/girepository-1.0"
          } >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Cache babl, GEGL, and Clay build trees
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/babl
            ${{ runner.temp }}/gegl
            ${{ runner.temp }}/_install
            ${{ runner.temp }}/build-arm64
          key: macos-clay-${{ hashFiles('meson.build', 'meson_options.txt', 'build/macos/all-deps-uni.txt', 'app/meson.build') }}
          restore-keys: |
            macos-clay-

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$cert" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain" >/dev/null
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain"

      - name: Install Homebrew dependencies
        run: |
          brew install --quiet $(tr '\\' '\n' < build/macos/all-deps-uni.txt | sed 's/#.*//' \
            | sed -n 's/.*|homebrew://p' | awk '{print $1}' | sort -u) ninja

      - name: Build babl and GEGL
        run: |
          set -euo pipefail
          for dep in babl gegl; do
            src="$RUNNER_TEMP/$dep"
            bld="$RUNNER_TEMP/$dep/_build"
            if [ ! -f "$bld/build.ninja" ]; then
              git clone --depth 1 "https://gitlab.gnome.org/GNOME/$dep.git" "$src"
              meson setup "$bld" "$src" -Dprefix="$CLAY_PREFIX" -Dbuildtype=debugoptimized \
                -Dc_args="-I$OPT_PREFIX/include" -Dcpp_args="-I$OPT_PREFIX/include" \
                -Dc_link_args="-L$OPT_PREFIX/lib" -Dcpp_link_args="-L$OPT_PREFIX/lib"
              ninja -C "$bld"
              ninja -C "$bld" install
            else
              echo "Using cached $dep build; rebuilding only if needed"
              ninja -C "$bld"
              ninja -C "$bld" install
            fi
          done

      - name: Build Clay
        run: |
          set -euo pipefail
          if [ ! -f "$BUILD_DIR/build.ninja" ]; then
            meson setup "$BUILD_DIR" . -Dprefix="$CLAY_PREFIX" -Dbuildtype=debugoptimized \
              -Drelocatable-bundle=yes -Ddmg=true -Denable-default-bin=enabled -Dbuild-id=xyz.kainzmayer.clay \
              -Dc_args="-I$OPT_PREFIX/include" -Dcpp_args="-I$OPT_PREFIX/include" \
              -Dc_link_args="-L$OPT_PREFIX/lib" -Dcpp_link_args="-L$OPT_PREFIX/lib"
          fi
          ninja -C "$BUILD_DIR"

      - name: Bundle Clay.app
        run: meson install -C "$BUILD_DIR"

      - name: Sign, build DMG and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SKIP_NOTARIZE: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.notarize) && '1' || '' }}
        run: build/macos/dmg/clay-dist-local.sh "$BUILD_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: clay-macos-dmg
          path: ${{ env.DIST_DIR }}/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST_DIR"/*.dmg --clobber
          else
            gh release create "$TAG" "$DIST_DIR"/*.dmg --title "Clay $TAG" --generate-notes
          fi
