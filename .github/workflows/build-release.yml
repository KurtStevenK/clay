name: Build & Release

# Builds the signed, notarized macOS DMG and attaches it to the GitHub release of a
# v* tag. The VirusTotal workflow listens for this workflow by name, so keep the name.
on:
  push:
    tags: ['v*']
  # Build and sign (no notarization, no release) when the macOS build changes
  pull_request:
    paths:
      - .github/workflows/build-release.yml
      - build/macos/**
      - gimp-data/images/logo/**
      - tools/make-mac-typelib.py
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the DMG (adds 20+ minutes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS DMG (arm64)
    # Homebrew builds its libraries for the runner's macOS, so this sets the oldest
    # macOS the DMG runs on (clay-dist-local.sh writes it into LSMinimumSystemVersion).
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      OPT_PREFIX: /opt/homebrew
    steps:
      - uses: actions/checkout@v7

      - name: Require Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Run scripts/push-apple-signing-to-github.sh"
            exit 1
          fi

      - name: Set up paths
        run: |
          {
            echo "GIMP_PREFIX=$RUNNER_TEMP/_install"
            echo "BUILD_DIR=$RUNNER_TEMP/build-arm64"
            echo "DIST_DIR=$RUNNER_TEMP/dist"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/_install/lib/pkgconfig:$OPT_PREFIX/lib/pkgconfig:$OPT_PREFIX/share/pkgconfig:$OPT_PREFIX/opt/libarchive/lib/pkgconfig"
            echo "XDG_DATA_DIRS=$RUNNER_TEMP/_install/share:$OPT_PREFIX/share"
            echo "GI_TYPELIB_PATH=$RUNNER_TEMP/_install/lib/girepository-1.0:$OPT_PREFIX/lib/girepository-1.0"
          } >> "$GITHUB_ENV"
          # The runner's default Xcode: newer ones may crash in actool on this macOS.
          # Without the Liquid Glass icon the app falls back to AppIcon.icns.
          xcodebuild -version

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass=$(openssl rand -hex 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$cert" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain" >/dev/null
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain"

      - name: Install Homebrew dependencies
        run: |
          brew install --quiet $(tr '\\' '\n' < build/macos/all-deps-uni.txt | sed 's/#.*//' \
            | sed -n 's/.*|homebrew://p' | awk '{print $1}' | sort -u) ninja

      - name: Build babl and GEGL
        run: |
          for dep in babl gegl; do
            git clone --depth 1 "https://gitlab.gnome.org/GNOME/$dep.git" "$RUNNER_TEMP/$dep"
            meson setup "$RUNNER_TEMP/$dep/_build" "$RUNNER_TEMP/$dep" -Dprefix="$GIMP_PREFIX" -Dbuildtype=debugoptimized \
              -Dc_args="-I$OPT_PREFIX/include" -Dcpp_args="-I$OPT_PREFIX/include" \
              -Dc_link_args="-L$OPT_PREFIX/lib" -Dcpp_link_args="-L$OPT_PREFIX/lib"
            ninja -C "$RUNNER_TEMP/$dep/_build"
            ninja -C "$RUNNER_TEMP/$dep/_build" install
          done

      - name: Build Clay
        run: |
          meson setup "$BUILD_DIR" . -Dprefix="$GIMP_PREFIX" -Dbuildtype=debugoptimized \
            -Drelocatable-bundle=yes -Ddmg=true -Denable-default-bin=enabled -Dbuild-id=xyz.kainzmayer.clay \
            -Dc_args="-I$OPT_PREFIX/include" -Dcpp_args="-I$OPT_PREFIX/include" \
            -Dc_link_args="-L$OPT_PREFIX/lib" -Dcpp_link_args="-L$OPT_PREFIX/lib"
          ninja -C "$BUILD_DIR"

      - name: Bundle Clay.app
        run: meson install -C "$BUILD_DIR"

      - name: Sign, build DMG and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Releases (v* tags, pushed or run by hand) always notarize; other manual runs only when asked
          SKIP_NOTARIZE: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.notarize) && '1' || '' }}
        run: build/macos/dmg/clay-dist-local.sh "$BUILD_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: clay-macos-dmg
          path: ${{ env.DIST_DIR }}/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the release
        # Also from a manual run on the tag, in case the tag push did not start a run
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST_DIR"/*.dmg --clobber
          else
            gh release create "$TAG" "$DIST_DIR"/*.dmg --title "Clay $TAG" --generate-notes
          fi
